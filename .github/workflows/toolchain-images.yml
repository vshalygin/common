name: Toolchain images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/*.Dockerfile
      - .github/workflows/toolchain-images.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC x64
            dockerfile: linux-gcc-x64.Dockerfile
            image: linux-gcc-x64
            tag: ubuntu-22.04-gcc-11
          - name: Linux GCC x86
            dockerfile: linux-gcc-x86.Dockerfile
            image: linux-gcc-x86
            tag: ubuntu-22.04-gcc-11
          - name: Linux Clang x64
            dockerfile: linux-clang-x64.Dockerfile
            image: linux-clang-x64
            tag: ubuntu-22.04-clang-14
          - name: Linux Clang x86
            dockerfile: linux-clang-x86.Dockerfile
            image: linux-clang-x86
            tag: ubuntu-22.04-clang-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ matrix.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
