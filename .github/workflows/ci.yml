name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

env:
  VCPKG_COMMIT: ddd0023b0eee70986e42ed49d9d4afb8098f212e

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-toolchain-changes:
    name: Detect toolchain image changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      images_changed: ${{ steps.changes.outputs.images_changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Docker context changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "images_changed=false" >> "${GITHUB_OUTPUT}"
          elif ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "images_changed=true" >> "${GITHUB_OUTPUT}"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- docker .github/workflows/toolchain-images.yml; then
            echo "images_changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "images_changed=true" >> "${GITHUB_OUTPUT}"
          fi

  build-toolchain-images:
    name: Build changed toolchain images
    needs: detect-toolchain-changes
    if: needs.detect-toolchain-changes.outputs.images_changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/toolchain-images.yml
    secrets: inherit

  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.architecture }} ${{ matrix.configuration }}
    needs:
      - detect-toolchain-changes
      - build-toolchain-images
    if: >-
      always() &&
      needs.detect-toolchain-changes.result == 'success' &&
      (needs.build-toolchain-images.result == 'success' ||
       needs.build-toolchain-images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    container:
      image: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ matrix.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - compiler: GCC
            architecture: x64
            configuration: Debug
            preset: linux-gcc-debug
            image: linux-gcc-x64
            image_tag: ubuntu-22.04-gcc-11
            cache_key: gcc-x64
            dockerfile: docker/linux-gcc-x64.Dockerfile
            artifact: vshalygin-common-linux-gcc-x64-debug
          - compiler: GCC
            architecture: x86
            configuration: Debug
            preset: linux-gcc-x86-debug
            image: linux-gcc-x86
            image_tag: ubuntu-22.04-gcc-11
            cache_key: gcc-x86
            dockerfile: docker/linux-gcc-x86.Dockerfile
            artifact: vshalygin-common-linux-gcc-x86-debug
          - compiler: Clang
            architecture: x64
            configuration: Debug
            preset: linux-clang-debug
            image: linux-clang-x64
            image_tag: ubuntu-22.04-clang-14
            cache_key: clang-x64
            dockerfile: docker/linux-clang-x64.Dockerfile
            artifact: vshalygin-common-linux-clang-x64-debug
          - compiler: Clang
            architecture: x86
            configuration: Debug
            preset: linux-clang-x86-debug
            image: linux-clang-x86
            image_tag: ubuntu-22.04-clang-14
            cache_key: clang-x86
            dockerfile: docker/linux-clang-x86.Dockerfile
            artifact: vshalygin-common-linux-clang-x86-debug
          - compiler: GCC
            architecture: x64
            configuration: Release
            preset: linux-gcc-release
            image: linux-gcc-x64
            image_tag: ubuntu-22.04-gcc-11
            cache_key: gcc-x64
            dockerfile: docker/linux-gcc-x64.Dockerfile
            artifact: vshalygin-common-linux-gcc-x64-release
          - compiler: GCC
            architecture: x86
            configuration: Release
            preset: linux-gcc-x86-release
            image: linux-gcc-x86
            image_tag: ubuntu-22.04-gcc-11
            cache_key: gcc-x86
            dockerfile: docker/linux-gcc-x86.Dockerfile
            artifact: vshalygin-common-linux-gcc-x86-release
          - compiler: Clang
            architecture: x64
            configuration: Release
            preset: linux-clang-release
            image: linux-clang-x64
            image_tag: ubuntu-22.04-clang-14
            cache_key: clang-x64
            dockerfile: docker/linux-clang-x64.Dockerfile
            artifact: vshalygin-common-linux-clang-x64-release
          - compiler: Clang
            architecture: x86
            configuration: Release
            preset: linux-clang-x86-release
            image: linux-clang-x86
            image_tag: ubuntu-22.04-clang-14
            cache_key: clang-x86
            dockerfile: docker/linux-clang-x86.Dockerfile
            artifact: vshalygin-common-linux-clang-x86-release

    env:
      VCPKG_BINARY_CACHE: /tmp/vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,/tmp/vcpkg-binary-cache,readwrite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare vcpkg binary cache
        run: mkdir -p "${VCPKG_BINARY_CACHE}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: /tmp/vcpkg-binary-cache
          key: vcpkg-linux-${{ matrix.cache_key }}-${{ hashFiles('vcpkg.json', 'example/rpc-example/vcpkg.json', 'CMakePresets.json', 'example/rpc-example/CMakePresets.json', matrix.dockerfile) }}
          restore-keys: |
            vcpkg-linux-${{ matrix.cache_key }}-

      - name: Configure libraries and tests
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build libraries and tests
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Run tests
        run: ctest --preset "${{ matrix.preset }}"

      - name: Install libraries
        run: cmake --install "out/build/${{ matrix.preset }}"

      - name: Configure rpc-example
        working-directory: example/rpc-example
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build rpc-example
        working-directory: example/rpc-example
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Upload installed package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/install/${{ matrix.preset }}
          if-no-files-found: error

      - name: Upload rpc-example
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-rpc-example
          path: out/build/rpc-example/${{ matrix.preset }}/rpc-example
          if-no-files-found: error

  address-undefined-sanitizers:
    name: Clang x64 ASan + UBSan Debug
    needs:
      - detect-toolchain-changes
      - build-toolchain-images
    if: >-
      always() &&
      needs.detect-toolchain-changes.result == 'success' &&
      (needs.build-toolchain-images.result == 'success' ||
       needs.build-toolchain-images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    container:
      image: ghcr.io/${{ github.repository }}-linux-clang-x64:ubuntu-22.04-clang-14
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      VCPKG_BINARY_CACHE: /tmp/vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,/tmp/vcpkg-binary-cache,readwrite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare vcpkg binary cache
        run: mkdir -p "${VCPKG_BINARY_CACHE}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: /tmp/vcpkg-binary-cache
          key: vcpkg-linux-clang-x64-${{ hashFiles('vcpkg.json', 'example/rpc-example/vcpkg.json', 'CMakePresets.json', 'example/rpc-example/CMakePresets.json', 'docker/linux-clang-x64.Dockerfile') }}
          restore-keys: |
            vcpkg-linux-clang-x64-

      - name: Configure ASan and UBSan build
        run: cmake --preset linux-clang-asan-debug

      - name: Build with ASan and UBSan
        run: cmake --build --preset linux-clang-asan-debug --parallel

      - name: Run tests with ASan and UBSan
        run: ctest --preset linux-clang-asan-debug

  thread-sanitizer:
    name: Clang x64 TSan Debug
    needs:
      - detect-toolchain-changes
      - build-toolchain-images
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.detect-toolchain-changes.result == 'success' &&
      (needs.build-toolchain-images.result == 'success' ||
       needs.build-toolchain-images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    container:
      image: ghcr.io/${{ github.repository }}-linux-clang-x64:ubuntu-22.04-clang-14
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      VCPKG_BINARY_CACHE: /tmp/vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,/tmp/vcpkg-binary-cache,readwrite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare vcpkg binary cache
        run: mkdir -p "${VCPKG_BINARY_CACHE}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: /tmp/vcpkg-binary-cache
          key: vcpkg-linux-clang-x64-${{ hashFiles('vcpkg.json', 'example/rpc-example/vcpkg.json', 'CMakePresets.json', 'example/rpc-example/CMakePresets.json', 'docker/linux-clang-x64.Dockerfile') }}
          restore-keys: |
            vcpkg-linux-clang-x64-

      - name: Configure TSan build
        run: cmake --preset linux-clang-tsan-debug

      - name: Build with TSan
        run: cmake --build --preset linux-clang-tsan-debug --parallel

      - name: Run tests with TSan
        run: ctest --preset linux-clang-tsan-debug

  coverage:
    name: GCC x64 Debug Coverage
    needs:
      - detect-toolchain-changes
      - build-toolchain-images
    if: >-
      always() &&
      needs.detect-toolchain-changes.result == 'success' &&
      (needs.build-toolchain-images.result == 'success' ||
       needs.build-toolchain-images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/${{ github.repository }}-linux-gcc-x64:ubuntu-22.04-gcc-11
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    env:
      VCPKG_BINARY_CACHE: /tmp/vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,/tmp/vcpkg-binary-cache,readwrite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare vcpkg binary cache
        run: mkdir -p "${VCPKG_BINARY_CACHE}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: /tmp/vcpkg-binary-cache
          key: vcpkg-linux-gcc-x64-${{ hashFiles('vcpkg.json', 'example/rpc-example/vcpkg.json', 'CMakePresets.json', 'example/rpc-example/CMakePresets.json', 'docker/linux-gcc-x64.Dockerfile') }}
          restore-keys: |
            vcpkg-linux-gcc-x64-

      - name: Ensure gcovr is available
        run: python3 -m pip install --no-cache-dir "gcovr==8.6"

      - name: Configure coverage build
        run: cmake --preset linux-gcc-coverage

      - name: Build, test, and generate coverage reports
        run: cmake --build --preset linux-gcc-coverage --parallel

      - name: Add coverage to job summary
        run: cat out/build/linux-gcc-coverage/coverage/coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: vshalygin-common-linux-gcc-x64-coverage
          path: out/build/linux-gcc-coverage/coverage
          if-no-files-found: error

  windows:
    name: MSVC ${{ matrix.architecture }} ${{ matrix.configuration }}
    needs:
      - detect-toolchain-changes
      - build-toolchain-images
    if: >-
      always() &&
      needs.detect-toolchain-changes.result == 'success' &&
      (needs.build-toolchain-images.result == 'success' ||
       needs.build-toolchain-images.result == 'skipped')
    runs-on: windows-2022
    timeout-minutes: 120

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - architecture: x64
            configuration: Debug
            configure_preset: vs2022-x64
            build_preset: vs2022-x64-debug
            cache_key: msvc-x64
            artifact: vshalygin-common-msvc-x64-debug
          - architecture: Win32
            configuration: Debug
            configure_preset: vs2022-win32
            build_preset: vs2022-win32-debug
            cache_key: msvc-win32
            artifact: vshalygin-common-msvc-win32-debug
          - architecture: x64
            configuration: Release
            configure_preset: vs2022-x64
            build_preset: vs2022-x64-release
            cache_key: msvc-x64
            artifact: vshalygin-common-msvc-x64-release
          - architecture: Win32
            configuration: Release
            configure_preset: vs2022-win32
            build_preset: vs2022-win32-release
            cache_key: msvc-win32
            artifact: vshalygin-common-msvc-win32-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg and prepare binary cache
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\.vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          $vcpkgRoot = "$env:GITHUB_WORKSPACE\.vcpkg"
          $binaryCache = "$env:RUNNER_TEMP\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null

          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-windows-${{ matrix.cache_key }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'example/rpc-example/vcpkg.json', 'CMakePresets.json', 'example/rpc-example/CMakePresets.json') }}
          restore-keys: |
            vcpkg-windows-${{ matrix.cache_key }}-

      - name: Configure libraries and tests
        run: cmake --preset "${{ matrix.configure_preset }}"

      - name: Build libraries and tests
        run: cmake --build --preset "${{ matrix.build_preset }}" --parallel

      - name: Run tests
        run: ctest --preset "${{ matrix.build_preset }}"

      - name: Install libraries
        run: cmake --install "out/build/${{ matrix.configure_preset }}" --config "${{ matrix.configuration }}"

      - name: Configure rpc-example
        working-directory: example/rpc-example
        run: cmake --preset "${{ matrix.configure_preset }}"

      - name: Build rpc-example
        working-directory: example/rpc-example
        run: cmake --build --preset "${{ matrix.build_preset }}" --parallel

      - name: Upload installed package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/install/${{ matrix.configure_preset }}
          if-no-files-found: error

      - name: Upload rpc-example
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-rpc-example
          path: out/build/rpc-example/${{ matrix.configure_preset }}/${{ matrix.configuration }}/rpc-example.*
          if-no-files-found: error
