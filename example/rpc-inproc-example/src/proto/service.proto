syntax = "proto3";

package vsh.example.proto;

option cc_generic_services = true;

message GetUserRequest {
  int32 user_id = 1;
}

message GetUserResponse {
  int32 user_id = 1;
  string name = 2;
  string email = 3;
}

service Service {
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc GetUser2 (GetUserRequest) returns (GetUserResponse);
}

service ServerService {
  rpc GetUserServer (GetUserRequest) returns (GetUserResponse);
  rpc GetUserServer2 (GetUserRequest) returns (GetUserResponse);
}

service ClientService {
  rpc GetUserClient (GetUserRequest) returns (GetUserResponse);
  rpc GetUserClient2 (GetUserRequest) returns (GetUserResponse);
}
